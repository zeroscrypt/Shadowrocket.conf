# ============================================================
# 12. RUSSIAN TLD
# ============================================================
#
# ВАЖНО:
#
# Это правило находится ПОСЛЕ всех важных правил.
#
# Любой неизвестный *.ru/.рф/.su -> DIRECT.
#
# Поэтому мы не ломаем российские сайты,
# даже если забыли добавить их отдельно.
#

DOMAIN-SUFFIX,ru,DIRECT
DOMAIN-SUFFIX,рф,DIRECT
DOMAIN-SUFFIX,su,DIRECT


# ============================================================
# 13. RUSSIAN IP
# ============================================================
#
# Российский IP -> DIRECT.
#
# Это позволяет нормально работать российским CDN,
# которые используют домены не .ru.
#
# ВАЖНО:
# НЕ использовать no-resolve здесь.
#

# GEOIP,RU,DIRECT


# ============================================================
# 14. EVERYTHING ELSE
# ============================================================
#
# ВСЁ, что не совпало выше:
#
# Google
# YouTube
# GitHub
# Apple
# ChatGPT
# Claude
# Telegram
# Discord
# Instagram
# Facebook
# X
# Reddit
# зарубежные сайты
# неизвестные сайты
# заблокированные сайты
#
# -> PROXY
#
# dns-failed:
# если домен не удалось разрешить нормально,
# запрос всё равно пытаемся отправить через proxy.
#

FINAL,PROXY,dns-failed


[Host]


# ============================================================
# LOCAL
# ============================================================

localhost = 127.0.0.1


# ============================================================
# CRITICAL RUSSIA — SYSTEM DNS
# ============================================================
#
# Для российских сервисов используем системный DNS.
#
# Это помогает российским CDN определить правильный
# регион и выбрать российский edge.
#
# ============================================================


